name: 银狐木马监测 - 每日更新

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      # ✅ 升级：v4 → v5（使用 Node.js 24）
      - name: 检出代码
        uses: actions/checkout@v5

      # ✅ 升级：v5 → v6（使用 Node.js 24）
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 运行银狐监测脚本
        run: python main.py

      - name: 查看生成结果
        run: cat yinhu.txt

      - name: 提交更新后的规则文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yinhu.txt
          git commit -m "自动更新规则 $(date +'%Y-%m-%d %H:%M')" || echo "无变更"
          git push
